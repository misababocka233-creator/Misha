<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Dudec Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Рахунок -->
        <div class="score-box">
            <h1 id="score">0</h1>
            <p class="score-label">очки</p>
        </div>

        <!-- Дудець -->
        <div class="dudec-wrapper" id="dudec-box">
            <span class="note note-left">🎵</span>
            <img id="dudec-img" src="dudec.png" alt="Mr. Dudec">
            <span class="note note-right">🎶</span>
        </div>

        <!-- Нижнє меню (як на скрінах) -->
        <div class="bottom-menu">
            <button class="menu-btn" id="btn-skins">СКІНИ</button>
            <button class="menu-btn icon-btn" id="btn-reset">🔄</button>
            <button class="menu-btn icon-btn" id="btn-settings">⚙️</button>
        </div>

        <!-- Модалка СКІНИ (як на скрінах) -->
        <div class="modal-overlay hidden" id="modal-skins">
            <div class="modal-card">
                <h2>СКІНИ</h2>
                
                <label>сорі що так мало:</label>
                <select id="select-skin" class="custom-select">
                    <option value="classic">скін 1 </option>
                    <option value="gold">скін 2</option>
                    <option value="phonk">скін 3</option>
                </select>

                <label>ОБЕРИ ВИД СКЕЛЕТІВ:</label>
                <select id="select-skel" class="custom-select">
                    <option value="classic">Скелет 1</option>
                    <option value="gold">Скелет 2</option>
                    <option value="phonk">Скелет 3</option>
                </select>

                <label>ОБЕРИ МУЗИКУ:</label>
                <select id="select-music" class="custom-select">
                    <option value="dudec">Classic Doot</option>
                    <option value="das">Spooky</option>
                    <option value="1doot">Shrek Sax</option>
                </select>

                <button class="btn-red" id="save-skins">ЗБЕРЕГТИ</button>
            </div>
        </div>

        <!-- Модалка НАЛАШТУВАННЯ (як на скрінах) -->
        <div class="modal-overlay hidden" id="modal-settings">
            <div class="modal-card">
                <h2>НАЛАШТУВАННЯ</h2>
                
                <div class="volume-row">
                    <span>Гучність:</span>
                    <input type="range" id="volume-range" min="0" max="1" step="0.1" value="0.5">
                </div>

                <button class="btn-red" id="save-settings">ЗБЕРЕГТИ</button>
            </div>
        </div>

        <!-- Модалка GAME OVER (як на скрінах) -->
        <div class="modal-overlay hidden" id="modal-gameover">
            <div class="modal-card modal-gameover-card">
                <h2 class="gameover-title">GAME OVER</h2>
                <p class="gameover-text">Твій результат: <span id="final-score">0</span> DOOTS</p>
                <button class="btn-red" id="restart-btn">ЗНОВУ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
